# Generated by `cargo bake cargo:setup:artifacts`. Builds, signs, and verifies
# project-specific files and attaches them to the GitHub Release that
# publish.yml creates. The project supplies scripts/release-artifacts/build,
# sign, and verify; this workflow supplies the release checks.
name: Release artifacts

on:
  workflow_run:
    workflows: [Publish to crates.io]
    types: [completed]
    branches: [__BRANCH__]
  # Build the artifacts of an existing release, such as one made before this
  # workflow was added. Delete a release's assets first to replace them.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, such as v1.2.3.
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  detect:
    # A successful publish run for a push to __BRANCH__ in this repository, or
    # a manual run of the workflow as it is on __BRANCH__.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/__BRANCH__') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release: ${{ steps.detect.outputs.release }}
      tag: ${{ steps.detect.outputs.tag }}
      version: ${{ steps.detect.outputs.version }}
      sha: ${{ steps.detect.outputs.sha }}
    steps:
      # The checks run from __BRANCH__, never from the commit being checked.
      - uses: actions/checkout@v7
        with:
          ref: __BRANCH__
          fetch-depth: 0
          persist-credentials: false
      - name: Look for a release trailer
        id: trailer
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Skip building Bake for pushes that request no release. The detect task validates the trailer fully.
          present=true
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            trailer=$(git show --no-patch --format='format:%(trailers:key=Release,valueonly)' --end-of-options "$RELEASE_SHA^{commit}" --)
            if [[ -z "$trailer" ]]; then present=false; fi
          fi
          echo "present=$present" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.trailer.outputs.present == 'true'
      - name: Install Bake launcher
        if: steps.trailer.outputs.present == 'true'
        run: cargo install bake --locked
      - name: Find the release commit
        id: detect
        if: steps.trailer.outputs.present == 'true'
        env:
          BAKE_TAG: ${{ inputs.tag }}
          BAKE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: cargo bake --locked cargo:release:artifacts:detect --branch __BRANCH__ --tag "$BAKE_TAG" --sha "$BAKE_SHA"

  # Build from the released commit, with no secrets and a read-only token.
  build:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ needs.detect.outputs.tag }}
      RELEASE_VERSION: ${{ needs.detect.outputs.version }}
      RELEASE_SHA: ${{ needs.detect.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}
          persist-credentials: false
      - name: Check the released commit
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the release artifacts
        run: |
          export RELEASE_ARTIFACTS="$RUNNER_TEMP/release-artifacts"
          mkdir "$RELEASE_ARTIFACTS"
          scripts/release-artifacts/build
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-unsigned
          path: ${{ runner.temp }}/release-artifacts/
          if-no-files-found: error
          retention-days: 1

  # Sign on a fresh runner that never ran the build, so build scripts and
  # dependencies never share a machine with the signing secrets.
  sign:
    needs: [detect, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: __ENVIRONMENT__
    concurrency: release-artifacts-${{ needs.detect.outputs.tag }}
    env:
      RELEASE_TAG: ${{ needs.detect.outputs.tag }}
      RELEASE_VERSION: ${{ needs.detect.outputs.version }}
      RELEASE_SHA: ${{ needs.detect.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.detect.outputs.sha }}
          persist-credentials: false
      - name: Check the released commit
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts-unsigned
          path: ${{ runner.temp }}/release-artifacts
      # Only this step sees the secrets, as 0600 files in $RELEASE_SECRETS.
      - name: Sign the release artifacts
__SECRETS_ENV__        run: |
          export RELEASE_ARTIFACTS="$RUNNER_TEMP/release-artifacts"
          export RELEASE_SECRETS="$RUNNER_TEMP/release-secrets"
          umask 077
          mkdir "$RELEASE_SECRETS"
          for variable in $(compgen -e RELEASE_SECRET_ || true); do
            name="${variable#RELEASE_SECRET_}"
            if [[ -z "${!variable}" ]]; then
              echo "::error::The __ENVIRONMENT__ environment has no $name secret."
              exit 1
            fi
            printf '%s' "${!variable}" > "$RELEASE_SECRETS/$name"
            unset "$variable"
          done
          scripts/release-artifacts/sign
      - name: Remove the signing secrets
        if: always()
        run: rm -rf "$RUNNER_TEMP/release-secrets"
      - name: Verify the release artifacts
        run: |
          export RELEASE_ARTIFACTS="$RUNNER_TEMP/release-artifacts"
          scripts/release-artifacts/verify
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/release-artifacts/
          if-no-files-found: error
          retention-days: 1

  # Attach the verified files without running any project code.
  attach:
    needs: [detect, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.detect.outputs.tag }}
      RELEASE_SHA: ${{ needs.detect.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/release-artifacts
      - name: Attach the artifacts to the GitHub Release
        run: |
          # The release tag ruleset stops the tag moving; check that it still names the built commit anyway.
          reference=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.type + " " + .object.sha')
          type="${reference%% *}"
          object="${reference#* }"
          if [[ "$type" == tag ]]; then
            object=$(gh api "repos/$GH_REPO/git/tags/$object" --jq .object.sha)
          fi
          if [[ "$object" != "$RELEASE_SHA" ]]; then
            echo "::error::$RELEASE_TAG names $object, not the built commit $RELEASE_SHA."
            exit 1
          fi
          cd "$RUNNER_TEMP/release-artifacts"
          shopt -s nullglob
          files=(*)
          for file in "${files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Release artifacts must be files; $file is not."
              exit 1
            fi
          done
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::There are no release artifacts to attach."
            exit 1
          fi
          # Without --clobber, an existing asset of the same name fails the upload instead of being replaced.
          gh release upload "$RELEASE_TAG" -- "${files[@]}"
          printf -- '- %s\n' "${files[@]}" >> "$GITHUB_STEP_SUMMARY"
